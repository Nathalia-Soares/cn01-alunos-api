name: Build and Deploy Docker Image to ACR and Web App - alunos-backend

on:
  push:
    branches:
      - feat/sql-server-db
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # necessário para checkout
      id-token: write # necessário para azure/login

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Gradle
        run: gradle clean build -x test

      # 👇 Login no Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 👇 Login no ACR
      - name: Azure Container Registry Login
        uses: azure/docker-login@v2
        with:
          login-server: alunosdocker.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      # 👇 Build da imagem Docker e push pro ACR
      - name: Build and Push Docker image
        run: |
          docker build -t alunosdocker.azurecr.io/alunos-backend:latest .
          docker push alunosdocker.azurecr.io/alunos-backend:latest

      # 👇 Deploy no Azure Web App (Container)
      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'alunos-backend'
          slot-name: 'Production'
          images: 'alunosdocker.azurecr.io/alunos-backend:latest'
